name: UI tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    name: ui-tests (${{ matrix.browser }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          HEADLESS: "true"
          BROWSER: ${{ matrix.browser }}
        run: pytest -n 4

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ matrix.browser }}
          path: reports/
